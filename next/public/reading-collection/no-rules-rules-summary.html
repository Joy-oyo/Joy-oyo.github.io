      <section><h1>No Rules Rules</h1><p>An interactive guide to Netflix’s culture of freedom and responsibility. Enable JavaScript to use chapter tabs.</p></section>
      <section><h2>1. First build up talent density</h2></section><section><h2>2. Then increase candor</h2></section><section><h2>3. Now begin removing controls</h2></section><section><h2>4. Pay top of personal market</h2></section><section><h2>5. Open the books</h2></section><section><h2>6. No decision-making approvals needed</h2></section><section><h2>7. The Keeper Test</h2></section><section><h2>8. A circle of feedback</h2></section><section><h2>9. Lead with context, not control</h2></section><section><h2>10. Bring it all to the world</h2></section>

  <script>
    const guide = {
      overview: {
        title: 'Freedom needs a system.',
        lede: 'Netflix did not remove rules first. It built the conditions that could make fewer rules productive: exceptional colleagues, unusually candid information, and leaders who replace approval with context.',
        copy: 'Reed Hastings and Erin Meyer present Netflix culture as a staged operating system for creative work. Each pass strengthens talent density, increases candor, and then removes another layer of control. The sequence is the argument: freedom without the preconditions becomes confusion, while rules without freedom slow adaptation.',
        levers: [
          ['01','Talent density','A small concentration of exceptional colleagues raises the quality of decisions, feedback, and coordination while reducing the need for process.'],
          ['02','Candor','Frequent, actionable feedback and broad transparency surface problems before hierarchy or politeness can hide them.'],
          ['03','Fewer controls','When people have the ability and information to decide well, policies and approvals can be replaced by context and accountability.']
        ],
        stages: [
          ['First steps','Build the foundation','Raise talent density, teach candid feedback, then remove vacation and expense controls.'],
          ['Next steps','Increase the stakes','Pay top of personal market, open sensitive information, and disperse decision authority.'],
          ['Reinforcement','Keep freedom viable','Use the Keeper Test, feedback rituals, and context-rich leadership to prevent freedom from decaying.']
        ]
      },
      chapters: [
        {
          id:'01', title:'First build up talent density', phase:'Section one · Foundation', role:'Precondition · colleague quality',
          problem:'A few merely adequate or destructive colleagues can consume managerial attention, suppress candor, and pull down the performance of an otherwise strong team.',
          mechanism:'Concentrate exceptional performers so the team can coordinate through judgment and peer standards rather than through protective process.',
          conclusion:'A great workplace is not primarily perks or job security; it is being surrounded by stunning colleagues who make ambitious work possible.',
          sections:[
            ['The unexpected lesson from layoffs','After Netflix reduced headcount during the dot-com crisis, the remaining team delivered more with fewer people. Hastings interprets the result as a rise in <strong>talent density</strong>: when strong contributors no longer compensate for weaker or corrosive behavior, energy and cooperation improve.'],
            ['Why density changes the operating system','High performers learn faster from one another, challenge weak work, and need less supervision. The authors argue that an adequate employee is not neutral on a creative team; their presence can increase process, lower the standard of discussion, and cause exceptional colleagues to leave.'],
            ['Performance, not effort','Netflix evaluates contribution rather than visible effort or loyalty. A colleague can work hard and still be a poor fit if their output, judgment, or collaboration does not strengthen the team. The desired metaphor is a championship team, not a family with unconditional membership.']
          ],
          mechanisms:[['Talent density','Exceptional people amplify one another and reduce coordination drag.'],['Contagion effect','Behavior and performance norms spread through a team.'],['Creative work','For innovation roles, one exceptional contributor may create disproportionately more value than several adequate ones.']],
          guardrail:'High talent density cannot mean “brilliant jerks.” The chapter treats collaboration, generosity, and the effect on colleagues as part of performance.',
          bridge:'Once the team can handle direct truth, Netflix can increase the speed and quality of feedback.'
        },
        {
          id:'02', title:'Then increase candor', phase:'Section one · Foundation', role:'Information system · feedback',
          problem:'Hierarchy, politeness, and fear allow weak ideas and damaging behavior to persist even when colleagues can see the problem.',
          mechanism:'Make frequent, direct feedback a normal contribution to the work, and teach a shared protocol for giving and receiving it.',
          conclusion:'Candor turns a group of talented individuals into a learning system, but only when the intent is helpful and the feedback is actionable.',
          sections:[
            ['Feedback is part of the job','Netflix treats useful feedback as something colleagues owe one another. A high performer who withholds an important observation protects comfort at the expense of the team’s future performance.'],
            ['The 4A framework','When giving feedback, <strong>Aim to assist</strong> and make it <strong>Actionable</strong>. When receiving it, <strong>Appreciate</strong> the effort and then <strong>Accept or discard</strong> the advice. The recipient retains agency; candor is not obedience.'],
            ['Leaders go first','A leader must ask for criticism publicly and respond without retaliation. Their reaction teaches more than any feedback policy: visible appreciation signals that dissent belongs, while defensiveness silently restores hierarchy.']
          ],
          mechanisms:[['Aim to assist','The purpose is improvement, not venting or status.'],['Actionable','Describe a behavior the recipient can change.'],['Appreciate','Treat feedback as a contribution, even when uncomfortable.'],['Accept or discard','The receiver decides what to do.']],
          guardrail:'Candor is not permission for cruelty. Remove people who use “honesty” to behave like jerks, and separate constructive challenge from personal attack.',
          bridge:'With talent and candor established, Netflix begins replacing written controls with judgment.'
        },
        {
          id:'03', title:'Now begin removing controls', phase:'Section one · Freedom', role:'First freedom · time and spending',
          problem:'Vacation limits and expense approvals protect against abuse, but they also teach adults to optimize for policy instead of business judgment.',
          mechanism:'Remove the policies, give leaders responsibility for setting context, audit outcomes, and respond visibly when trust is abused.',
          conclusion:'Removing a rule does not remove management; it replaces prescriptive control with explicit context, modeling, and consequences.',
          sections:[
            ['No vacation policy','Employees decide when and how much time to take without tracking days or seeking formal approval. But the absence of a rule creates ambiguity. Leaders must discuss seasonal needs, team coordination, and what responsible absence looks like—and visibly take vacation themselves.'],
            ['“Act in Netflix’s best interest”','Travel and expense policy becomes a short principle instead of a catalog of limits. Managers explain the business situation in advance, while finance audits a sample afterward. The goal is faster, more context-aware spending rather than permission seeking.'],
            ['Trust with visible consequences','The system accepts that some expenses may rise. What it cannot tolerate is deliberate abuse. When abuse is found, Netflix removes the person and communicates the reason so freedom is understood as responsibility rather than entitlement.']
          ],
          mechanisms:[['Leader modeling','Behavior fills the vacuum left by policy.'],['Context before action','Teams need to know constraints and business priorities.'],['Audit after action','Inspect patterns without requiring universal preapproval.'],['Consequences','Intentional abuse costs the freedom of the individual, not everyone else.']],
          guardrail:'Where errors can cause injury, illegality, or catastrophic loss, rules remain appropriate. The book’s argument is aimed primarily at creative and judgment-intensive work.',
          bridge:'Greater freedom raises the value of exceptional judgment, so the next stage strengthens talent density through compensation.'
        },
        {
          id:'04', title:'Pay top of personal market', phase:'Section two · Reinforce talent', role:'Talent density · compensation',
          problem:'Standard salary bands, annual adjustments, and bonuses can underpay exceptional creative talent and encourage people to leave before the company recognizes their market value.',
          mechanism:'Pay each creative employee at the top of their current personal market and revisit that market continuously rather than tying pay to an internal range or annual bonus.',
          conclusion:'For high-leverage creative roles, Netflix would rather employ fewer exceptional people at very high salaries than spread the budget across more adequate performers.',
          sections:[
            ['Personal market, not job title','The relevant question is what another employer would pay this particular person now, considering their skills, scarcity, network, and value. Two people with the same title may therefore have different market prices.'],
            ['Salary over bonus','The authors argue that bonuses work better for routine goals than creative work, where the most valuable result may be unexpected. Netflix puts more compensation into guaranteed salary so employees can focus on the business rather than a formula.'],
            ['Recruiter calls as market data','Employees are encouraged to learn what the market would pay them and share that information. Managers are expected to adjust proactively rather than treating outside offers as disloyalty.']
          ],
          mechanisms:[['Top of personal market','Price the individual’s external opportunity, not only the internal role.'],['No bonus formula','Avoid narrowing creative attention to predefined targets.'],['Continuous calibration','Use market conversations to update compensation before retention becomes a crisis.']],
          guardrail:'This logic depends on roles where performance differences are highly leveraged. It is less transferable to work that scales mainly through headcount or operates under fixed public-sector or union pay structures.',
          bridge:'Paying for judgment is not enough; people also need the information required to exercise it.'
        },
        {
          id:'05', title:'Open the books', phase:'Section two · Candor', role:'Information access · transparency',
          problem:'Leaders ask employees to make sophisticated decisions while withholding the strategy, financial position, mistakes, and upcoming changes that would make those decisions intelligible.',
          mechanism:'Share sensitive business information broadly, explain how to interpret it, and treat transparency about work as the default.',
          conclusion:'If employees are expected to act like owners, leaders must trust them with the context owners use—even when the information creates discomfort.',
          sections:[
            ['Transparency creates adult relationships','Netflix shares financial results, strategic debates, and possible reorganizations earlier than many companies. The short-term cost is anxiety or leakage risk; the intended gain is trust and better distributed judgment.'],
            ['Sunshine mistakes','Leaders openly describe their own errors and what they learned. Once competence is established, acknowledging failure can increase trust because it signals that bad news does not need to be hidden.'],
            ['Work transparency, personal privacy','The authors draw a boundary: incidents at work should generally be discussed so the organization can learn; private life belongs to the person. Transparency is not a claim on every personal fact.']
          ],
          mechanisms:[['Open financials','Teach people to read the business, not just their function.'],['Early disclosure','Share likely changes before every detail is settled.'],['Sunshining','Turn visible mistakes into collective learning.'],['Privacy boundary','Distinguish organizational facts from personal information.']],
          guardrail:'Transparency still has legal, contractual, security, and privacy limits. The principle is broad access to decision context—not indiscriminate disclosure.',
          bridge:'Once information travels widely, decision authority can follow it.'
        },
        {
          id:'06', title:'No decision-making approvals needed', phase:'Section two · Freedom', role:'Decision rights · informed captain',
          problem:'Approval chains move decisions toward the most senior person rather than the person with the deepest information, slowing innovation and teaching employees to please the boss.',
          mechanism:'Assign an informed captain, require them to farm for dissent and understand context, then let them make and own the bet without seeking permission.',
          conclusion:'Leadership should improve the quality of decentralized bets, not convert every bet into a senior executive’s decision.',
          sections:[
            ['Do not seek to please your boss','A proposal is not good because a manager likes it. The employee closest to the issue is expected to pursue what they believe is best for Netflix after gathering relevant views.'],
            ['Farm for dissent','Before acting, the informed captain actively asks colleagues—including skeptics—for criticism. This increases information without turning the choice into consensus. The captain remains accountable for the call.'],
            ['Celebrate the bet, sunshine the result','A failed project is not automatically a performance failure. Afterward, the captain explains what happened and what was learned. Leaders evaluate the quality of the reasoning and the portfolio of bets, not only one outcome.']
          ],
          mechanisms:[['Informed captain','Put ownership with the person who has the deepest context.'],['Farm for dissent','Collect disagreement before committing.'],['Think in bets','Judge a portfolio under uncertainty, not hindsight alone.'],['Sunshine failure','Make learning visible instead of hiding the miss.']],
          guardrail:'Decentralization fails when strategy is unclear, context is missing, or a decision creates unbounded risk for others. Leaders must define stakes and constraints before releasing control.',
          bridge:'More authority makes team quality even more consequential, leading to Netflix’s most demanding talent practice.'
        },
        {
          id:'07', title:'The Keeper Test', phase:'Section three · Reinforce talent', role:'Talent density · active renewal',
          problem:'Managers keep adequate performers because dismissal is painful, past loyalty is emotionally powerful, and the employee has not committed a visible offense.',
          mechanism:'Regularly ask whether you would fight to keep this person if they planned to leave; if not, offer generous severance and seek a stronger fit.',
          conclusion:'A dream team is maintained through active selection, so adequate performance may receive a generous exit rather than indefinite membership.',
          sections:[
            ['Team, not family','Netflix uses the professional sports team metaphor. Members support one another intensely, but positions are continually matched to what the team needs now. Past contribution earns respect, not a permanent role.'],
            ['The manager’s question','The Keeper Test asks: if this person said they were leaving for a peer company, would I fight hard to keep them? A quiet sense of relief is treated as evidence that the role should be reopened.'],
            ['The Keeper Test prompt','Employees are encouraged to ask managers: “If I were thinking of leaving, how hard would you work to change my mind?” This attempts to reduce hidden uncertainty and give people a chance to improve before a surprise exit.']
          ],
          mechanisms:[['Keeper Test','Convert vague satisfaction into a direct retention judgment.'],['Keeper Test prompt','Let employees surface the manager’s current assessment.'],['Generous severance','Make a performance-based transition less punitive and more workable.'],['Role fit over loyalty','Evaluate present contribution against present team needs.']],
          guardrail:'The practice can produce fear, bias, and short-termism if standards are unclear or managers avoid candid coaching. A generous severance does not substitute for fair, evidence-based judgment.',
          bridge:'When employment is this fluid, feedback must become more systematic and visible.'
        },
        {
          id:'08', title:'A circle of feedback', phase:'Section three · Reinforce candor', role:'Feedback system · rituals',
          problem:'Informal one-to-one candor can remain uneven, hierarchical, or avoidant, leaving blind spots that colleagues collectively recognize but no one surfaces.',
          mechanism:'Create recurring, structured feedback rituals in which everyone gives and receives useful observations under the same 4A rules.',
          conclusion:'Candor becomes culture only when feedback is routine, multi-directional, and practiced in public enough to overcome hierarchy.',
          sections:[
            ['Live 360 feedback','Teams gather to offer direct feedback around a circle. The format creates shared accountability: leaders receive criticism in front of others, and participants learn what useful candor sounds like.'],
            ['Written 360 feedback','Written input can broaden participation and create reflection time, especially across geographies. Netflix separates developmental feedback from a scored annual performance process.'],
            ['Feedback is not consensus','The receiver appreciates the contribution but decides whether to accept or discard it. This protects autonomy while ensuring that relevant observations enter the decision environment.']
          ],
          mechanisms:[['Recurring ritual','Do not leave difficult truth to chance.'],['Multi-directional input','Peers and reports can challenge leaders.'],['4A discipline','Keep feedback helpful, actionable, appreciated, and nonbinding.'],['Development focus','Use feedback to improve performance rather than to produce a bureaucratic score.']],
          guardrail:'Public feedback can humiliate people if facilitation is weak or power differences are ignored. The quality of intent, specificity, and psychological safety determines whether the ritual teaches or harms.',
          bridge:'With feedback flowing, the final removal of control depends on leaders supplying enough strategic context.'
        },
        {
          id:'09', title:'Lead with context, not control', phase:'Section three · Freedom', role:'Leadership model · alignment',
          problem:'Leaders either centralize decisions to preserve alignment or delegate without enough shared understanding, producing obedience in one case and fragmentation in the other.',
          mechanism:'Create high alignment through clear strategy, stakes, assumptions, and constraints, then allow loosely coupled teams to decide how to execute.',
          conclusion:'The leader’s core job is not to approve the right answer but to build the context in which capable people can discover it independently.',
          sections:[
            ['The tree, not the pyramid','Senior leaders set broad direction; each level adds relevant context for the decisions below. Information should travel down and learning should travel up without turning every branch decision into a trunk decision.'],
            ['High alignment, loose coupling','Teams share the destination and dependencies but do not require constant cross-approval. This supports speed only when goals and interfaces are clear.'],
            ['When a decision fails','The leader first asks what context they failed to provide: Was the strategy unclear? Were goals contradictory? Did the person lack capability? Control is added only if the environment truly requires error prevention.']
          ],
          mechanisms:[['Context','Explain strategy, objectives, stakes, assumptions, and constraints.'],['High alignment','Create a shared understanding of what matters.'],['Loose coupling','Let teams decide without unnecessary coordination.'],['Error prevention vs innovation','Use more control where failure is intolerable; use more freedom where learning is valuable.']],
          guardrail:'Context cannot be a slogan. If leaders retain hidden preferences, punish reasonable misses, or change strategy without explanation, employees will correctly return to approval seeking.',
          bridge:'The model was built in a direct, US-centered culture; global expansion tests whether its assumptions can travel.'
        },
        {
          id:'10', title:'Bring it all to the world', phase:'Section four · Global', role:'Adaptation · cultural context',
          problem:'Practices such as radical candor, individual decision authority, and “team not family” carry different meanings across national cultures.',
          mechanism:'Map company culture against local norms, preserve the principle, and adapt the behavior and feedback channels used to express it.',
          conclusion:'A strong culture should travel with adaptability: do not abandon the value, but do not assume the US expression of that value is universal.',
          sections:[
            ['Map the cultural distance','Meyer compares Netflix norms with local expectations for directness, hierarchy, trust, and decision-making. The larger the gap, the more explicit translation the organization needs.'],
            ['Candor requires localization','In less direct cultures, spontaneous criticism may be rare, so Netflix adds formal feedback moments and puts feedback on the agenda. In more direct cultures, teams discuss how bluntness may be interpreted by international colleagues.'],
            ['The fifth A: Adaptability','The global extension to the 4A model is adaptability. Both sides should remain curious, explain intent, and adjust delivery so the underlying information survives the cultural translation.']
          ],
          mechanisms:[['Culture mapping','Compare corporate and national communication norms.'],['Formal channels','Create scheduled feedback where informal candor is unlikely.'],['Explicit translation','Discuss how the same behavior is interpreted across cultures.'],['Adaptability','Listen before teaching and change the expression without losing the principle.']],
          guardrail:'Localization cannot become a way to dismiss local employees as “not candid enough.” Cultural adaptation is a two-way design problem, not a demand that every office imitate headquarters.',
          bridge:'The book ends with a conditional claim: freedom and responsibility work when the organization keeps rebuilding the conditions that support them.'
        }
      ],
      review: [
        ['Survivorship bias','Netflix’s success makes the culture persuasive, but the cases do not prove that each practice caused the outcome or will reproduce it elsewhere.'],
        ['Creative-work boundary','The model is most plausible where innovation and judgment matter more than error prevention. Safety-critical, regulated, operational, and public-service contexts may need stronger controls.'],
        ['Power and candor','Employees giving candid feedback to leaders still face asymmetric risk. A framework cannot by itself guarantee psychological safety or prevent retaliation.'],
        ['Keeper Test costs','Continuous selection may sustain performance, but it can also increase anxiety, bias, internal competition, and reluctance to take long-horizon bets.'],
        ['Compensation economics','Top-of-personal-market pay depends on business margins, labor scarcity, and high individual leverage; it is not a universal workforce model.'],
        ['Best use','Treat the book as a sequence of conditional design choices: build capability and information before removing control, then keep testing whether the conditions still hold.']
      ]
    };

    const labels = {overview:'Overview'};
    guide.chapters.forEach(chapter => labels[chapter.id] = chapter.title);
    const nav = document.getElementById('chapter-nav');
    const content = document.getElementById('guide-content');
    const progress = document.getElementById('progress');
    const safe = value => value.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));

    function makeTab(target,index,name){const button=document.createElement('button');button.className='tab-button';button.type='button';button.role='tab';button.dataset.target=target;button.id=`tab-${target}`;button.setAttribute('aria-controls',`panel-${target}`);button.setAttribute('aria-selected',String(index===0));button.tabIndex=index===0?0:-1;button.innerHTML=`<span class="tab-index">${index===0?'00':String(index).padStart(2,'0')}</span><span class="tab-name">${safe(name)}</span>`;return button}
    nav.append(makeTab('overview',0,'Overview'),...guide.chapters.map((chapter,index)=>makeTab(chapter.id,index+1,chapter.title)));

    const overview=document.createElement('section');overview.className='panel is-active';overview.id='panel-overview';overview.role='tabpanel';overview.dataset.panel='overview';overview.setAttribute('aria-labelledby','tab-overview');overview.innerHTML=`
      <div class="overview-hero"><p class="overview-kicker">Reed Hastings × Erin Meyer · 2020</p><h1 class="overview-title">${safe(guide.overview.title)}</h1></div>
      <div class="overview-deck"><p class="overview-lede">${safe(guide.overview.lede)}</p><p class="overview-copy">${safe(guide.overview.copy)}</p></div>
      <section class="culture-system" aria-label="Netflix culture levers">${guide.overview.levers.map(item=>`<article class="system-row"><span class="system-no">${item[0]}</span><strong class="system-name">${item[1]}</strong><p class="system-copy">${item[2]}</p></article>`).join('')}</section>
      <section class="sequence" aria-label="Culture-building sequence">${guide.overview.stages.map(item=>`<article class="sequence-card"><span>${item[0]}</span><strong>${item[1]}</strong><p>${item[2]}</p></article>`).join('')}</section>
      <section class="book-review" aria-labelledby="review-title"><div class="review-head"><h2 class="review-title" id="review-title">Book review / reality check.</h2><p class="review-intro">The chapters represent Hastings and Meyer’s argument. This separate review preserves that argument while making its assumptions and transfer limits visible.</p></div><div class="review-points">${guide.review.map(item=>`<div class="review-point"><strong>${item[0]}</strong><span>${item[1]}</span></div>`).join('')}</div></section>`;
    content.append(overview);

    guide.chapters.forEach((chapter,index)=>{const panel=document.createElement('section');panel.className='panel';panel.id=`panel-${chapter.id}`;panel.role='tabpanel';panel.hidden=true;panel.dataset.panel=chapter.id;panel.setAttribute('aria-labelledby',`tab-${chapter.id}`);const next=guide.chapters[index+1];panel.innerHTML=`
      <header class="chapter-head"><div><p class="chapter-kicker">${safe(chapter.phase)}</p><h2 class="chapter-title">${safe(chapter.title)}</h2></div><span class="chapter-number">${chapter.id}</span></header>
      <section class="chapter-outcome" aria-label="Chapter outcome"><div class="outcome-cell outcome-role"><span class="outcome-label">Role in the system</span><p class="outcome-value">${safe(chapter.role)}</p></div><div class="outcome-cell"><span class="outcome-label">Culture problem</span><p class="outcome-value">${safe(chapter.problem)}</p></div><div class="outcome-cell"><span class="outcome-label">Author conclusion</span><p class="outcome-value">${safe(chapter.conclusion)}</p></div></section>
      <div class="chapter-body"><div class="chapter-rundown">${chapter.sections.map(section=>`<h3>${section[0]}</h3><p>${section[1]}</p>`).join('')}<aside class="guardrail"><h3>Condition for freedom</h3><p>${safe(chapter.guardrail)}</p></aside><p class="chapter-lesson"><strong>Chapter outcome</strong>${safe(chapter.conclusion)}</p><p class="chapter-bridge"><strong>Bridge</strong> · ${safe(chapter.bridge)}</p>${next?`<button class="next-button" type="button" data-next="${next.id}">Continue to ${safe(next.title)} →</button>`:''}</div><aside class="mechanisms"><h3>Operating mechanisms</h3>${chapter.mechanisms.map(item=>`<div class="mechanism"><strong>${item[0]}</strong><span>${item[1]}</span></div>`).join('')}</aside></div>`;content.append(panel)});

    const tabs=Array.from(document.querySelectorAll('.tab-button'));const panels=Array.from(document.querySelectorAll('[role="tabpanel"]'));
    function activate(target,options={}){const selected=tabs.find(tab=>tab.dataset.target===target);const panel=panels.find(item=>item.dataset.panel===target);if(!selected||!panel)return;tabs.forEach(tab=>{const active=tab===selected;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1});panels.forEach(item=>{const active=item===panel;item.classList.toggle('is-active',active);item.hidden=!active});const index=tabs.indexOf(selected);progress.textContent=`${labels[target]} · ${index+1} of ${tabs.length}`;history.replaceState(null,'',`#${target}`);selected.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});if(options.focus)selected.focus();if(options.scroll!==false)window.scrollTo({top:0,behavior:'smooth'})}
    tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>activate(tab.dataset.target));tab.addEventListener('keydown',event=>{let next=null;if(event.key==='ArrowDown'||event.key==='ArrowRight')next=(index+1)%tabs.length;if(event.key==='ArrowUp'||event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;if(event.key==='Home')next=0;if(event.key==='End')next=tabs.length-1;if(next!==null){event.preventDefault();activate(tabs[next].dataset.target,{focus:true})}})});document.querySelectorAll('[data-next]').forEach(button=>button.addEventListener('click',()=>activate(button.dataset.next)));const initial=window.location.hash.replace('#','');if(labels[initial])activate(initial,{scroll:false});
  </script>
</body>
</html>
